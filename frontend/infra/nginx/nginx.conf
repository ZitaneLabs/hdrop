worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # All runtime writes stay on the container's /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Revalidate HTML and unversioned public assets after each deployment.
        add_header Cache-Control "no-cache" always;
        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        # Next.js includes a content hash in these asset names.
        location ^~ /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Rust generates lowercase hexadecimal access tokens of 5–64 characters.
        # Serve the shell internally so the original path and fragment stay intact.
        location ~ "^/[0-9a-f]{5,64}/?$" {
            try_files /download.html =404;
        }

        # Exported pages use .html; missing assets and nested routes stay 404s.
        location / {
            # Only redirect known pages, never reflect arbitrary request paths.
            rewrite ^/(privacy|download)/$ /$1 permanent;
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
