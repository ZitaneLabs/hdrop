name: web

on:
  pull_request:
  push:
    branches:
      - development
      - production

jobs:
  test:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Test
        run: npm run test
        working-directory: ./frontend
      - name: Lint
        run: npm run lint
        working-directory: ./frontend
  license-check:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Check licenses
        run: ./check_licenses.sh
        working-directory: ./frontend
  static-image:
    runs-on: ubuntu-latest
    needs: [test, license-check]
    concurrency:
      group: ${{ github.workflow }}-image-${{ github.ref }}
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check image publication rules
        run: bash frontend/scripts/test-publish-image.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build static production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: hdrop-web:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify static runtime and Caddy routing
        run: bash frontend/scripts/test-static.sh hdrop-web:test
      - name: Install browser tests
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser upload and download
        run: |
          docker run -d --name hdrop-browser-test --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -p 127.0.0.1:8080:80 hdrop-web:test
          npm --prefix frontend run test:static
      - name: Stop browser test container
        if: always()
        run: docker rm -f hdrop-browser-test || true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: static-browser-test-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push'
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: bash frontend/scripts/publish-image.sh
