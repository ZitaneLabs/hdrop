name: web

on:
  pull_request:
  push:
    branches:
      - development
      - production

jobs:
  test:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        node: [20, 21]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/web
      - name: Test
        run: npm run test
        working-directory: ./frontend/web
      - name: Lint
        run: npm run lint
        working-directory: ./frontend/web
  license-check:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/web
      - name: Check licenses
        run: ./check_licenses.sh
        working-directory: ./frontend/web
