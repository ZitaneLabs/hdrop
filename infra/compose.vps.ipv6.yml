# IPv6-only VPS overlay.
#
# This overlay is auto-included by scripts/common.sh when VPS_IPV6_ONLY is truthy
# in config/vps.compose.env. It switches Docker build networking to host mode,
# which avoids bridge DNS issues often seen on IPv6-only hosts.
# Runtime networks are marked IPv6-enabled and use Docker-assigned pools to
# avoid fixed-subnet overlap errors on hosts with existing IPv6 bridge pools.

services:
  web:
    build:
      network: "${VPS_BUILD_NETWORK:-host}"

  api:
    build:
      network: "${VPS_BUILD_NETWORK:-host}"

networks:
  hdrop:
    enable_ipv6: true

  backend:
    enable_ipv6: true
