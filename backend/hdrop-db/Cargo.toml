[package]
name = "hdrop-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "uuid"] }
jiff-diesel = { version = "1", features = ["postgres"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "deadpool"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
tokio-postgres = "0.7"
percent-encoding = "2"
rand = "0.10"
tokio = { version = "1", features = ["rt"] }
whoami = "2"

jiff.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
metrics.workspace = true

hdrop-shared.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
