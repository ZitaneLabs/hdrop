services:
  caddy:
    init: true
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HDROP_SITE_ADDRESS=${HDROP_SITE_ADDRESS:?set HDROP_SITE_ADDRESS to your production hostname}
      - HDROP_MAX_UPLOAD_SIZE=${HDROP_MAX_UPLOAD_SIZE:-500MB}
    networks:
      - hdrop
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  web:
    init: true
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./hdrop-web-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEB_BASE_URL: ${HDROP_PUBLIC_URL:?set HDROP_PUBLIC_URL, for example https://hdrop.io}
        NEXT_PUBLIC_API_BASE_URL: ${HDROP_PUBLIC_URL:?set HDROP_PUBLIC_URL, for example https://hdrop.io}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - hdrop
  api:
    init: true
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./hdrop-server/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
      - "3001"
    networks:
      - hdrop
      - db
      - metrics
    environment:
      - HDROP_PORT=3000
      - PROMETHEUS_PORT=3001
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE:-path}
      # Optional; leaving this unset disables the overall S3 request timeout.
      - S3_REQUEST_TIMEOUT_SECS
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-/data/hdrop-files}
      - LOCAL_STORAGE_LIMIT_MB=${LOCAL_STORAGE_LIMIT_MB:-}
      - CORS_ORIGIN=${HDROP_PUBLIC_URL:?set HDROP_PUBLIC_URL, for example https://hdrop.io}
      - CACHE_STRATEGY=${CACHE_STRATEGY:-memory}
      - CACHE_MEMORY_LIMIT_MB=${CACHE_MEMORY_LIMIT_MB:-}
      - CACHE_DISK_LIMIT_MB=${CACHE_DISK_LIMIT_MB:-}
      - CACHE_DIR=${CACHE_DIR:-/cache/hdrop}
      - SINGLE_FILE_LIMIT_MB=${SINGLE_FILE_LIMIT_MB:-500}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL, for example postgres://hdrop:password@postgres:5432/hdrop}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - local_storage:/data/hdrop-files
      - cache_data:/cache/hdrop
  postgres:
    init: true
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:18-alpine
    profiles:
      - bundled-postgres
    restart: unless-stopped
    expose:
      - "5432"
    networks:
      - db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hdrop}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a secure password}
      - POSTGRES_DB=${POSTGRES_DB:-hdrop}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -U \"$${POSTGRES_USER:-hdrop}\" -d \"$${POSTGRES_DB:-hdrop}\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    init: true
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:v3
    restart: unless-stopped
    expose:
      - "9090"
    networks:
      - metrics
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=0.0.0.0:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  hdrop:
  db:
    internal: true
  metrics:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  cache_data:
  local_storage:
  postgres_data:
  prometheus_data:
