# Shared service definitions across environments.

services:
  web:
    image: "${WEB_IMAGE:-hdrop-web:latest}"
    networks:
      - hdrop
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-hdrop}"
      NEXT_PUBLIC_WEB_BASE_URL: "${NEXT_PUBLIC_WEB_BASE_URL:-http://localhost:3000}"
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}"
      NEXT_PUBLIC_PBKDF2_ITERATIONS: "${NEXT_PUBLIC_PBKDF2_ITERATIONS:-600000}"
      NEXT_PUBLIC_PASSWORD_BYTES: "${NEXT_PUBLIC_PASSWORD_BYTES:-32}"
      NEXT_PUBLIC_CHALLENGE_BYTES: "${NEXT_PUBLIC_CHALLENGE_BYTES:-32}"

  api:
    image: "${API_IMAGE:-hdrop-api:latest}"
    networks:
      - hdrop
      - backend
    environment:
      HDROP_PORT: "${HDROP_PORT:-80}"
      PROMETHEUS_PORT: "${HDROP_PROMETHEUS_PORT:-3001}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-s3}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-dev}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-dev}"
      S3_REGION: "${S3_REGION:-eu-west-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://localstack:4566}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-hdrop}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-http://localhost:4566/hdrop}"
      LOCAL_STORAGE_DIR: "${LOCAL_STORAGE_DIR:-files}"
      LOCAL_STORAGE_LIMIT_MB: "${LOCAL_STORAGE_LIMIT_MB:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      CACHE_STRATEGY: "${CACHE_STRATEGY:-memory}"
      CACHE_MEMORY_LIMIT_MB: "${CACHE_MEMORY_LIMIT_MB:-2000}"
      CACHE_DISK_LIMIT_MB: "${CACHE_DISK_LIMIT_MB:-2000}"
      CACHE_DIR: "${CACHE_DIR:-/tmp/hdrop-cache}"
      SINGLE_FILE_LIMIT_MB: "${SINGLE_FILE_LIMIT_MB:-500}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/hdrop}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HDROP_PORT:-80}/status"]

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:15-alpine}"
    networks:
      - backend
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-hdrop}"

  localstack:
    image: "${LOCALSTACK_IMAGE:-localstack/localstack:latest}"
    networks:
      - hdrop
      - backend
    environment:
      DEBUG: "${LOCALSTACK_DEBUG:-1}"
      SERVICES: "${LOCALSTACK_SERVICES:-s3}"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-dev}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-dev}"
      AWS_DEFAULT_REGION: "${S3_REGION:-eu-west-1}"
      SKIP_SSL_CERT_DOWNLOAD: "1"
      EDGE_BIND_HOST: "0.0.0.0"
      EXTRA_CORS_ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "wait", "bucket-exists", "--bucket", "${S3_BUCKET_NAME:-hdrop}"]

  prometheus:
    image: "${PROMETHEUS_IMAGE:-prom/prometheus:latest}"
    networks:
      - backend

networks:
  hdrop:
  backend:
