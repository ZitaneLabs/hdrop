[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # "RUSTSEC-0000-0000"
    "RUSTSEC-2024-0436", # paste is unmaintained

    # hdrop uses Jiff. Cargo Deny still reports these two unmaintained crates
    # because our S3 client, object_store, requires humantime for duration parsing
    # and exposes chrono timestamps in its public API. Remove each exception
    # when we upgrade to an object_store release that drops the corresponding crate.
    # https://github.com/apache/arrow-rs-object-store/pull/908
    { id = "RUSTSEC-2026-0542", allow = ["object_store"], expiry = "2027-02-15" },
    # https://github.com/apache/arrow-rs-object-store/issues/909
    { id = "RUSTSEC-2026-0543", allow = ["object_store"], expiry = "2027-02-15" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "ISC", # used by untrusted, dependency of hyper-rustls through hdrop-server
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "AGPL-3.0-or-later", # hdrop-db, hdrop-shared
    "CC0-1.0",
    "Zlib", # OSI approved, FSF free/libre, used by foldhash
]
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
skip = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index"
]
