name: web

on:
  pull_request:
  push:
    branches:
      - development
      - production

jobs:
  test:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Test
        run: npm run test
        working-directory: ./frontend
      - name: Lint
        run: npm run lint
        working-directory: ./frontend
      - name: Build
        run: npm run build
        working-directory: ./frontend
  license-check:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Check licenses
        run: ./check_licenses.sh
        working-directory: ./frontend
  static-image:
    runs-on: ubuntu-latest
    needs: [test, license-check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build static production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: hdrop-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build optional Next.js image
        run: docker build --target nextjs -t hdrop-web:nextjs-test frontend
      - name: Install browser tests
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify frontend runtimes, routing, and browser flows
        run: bash frontend/scripts/test-static.sh hdrop-web:test hdrop-web:nextjs-test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: static-browser-test-results
          path: frontend/test-results
          if-no-files-found: ignore
